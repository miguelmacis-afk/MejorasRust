name: Rust Staging Dataminer

on:
  schedule:
    # Se ejecuta en el minuto 0 de cada hora
    - cron: '0 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

jobs:
  datamine:
    runs-on: ubuntu-latest
    # Necesario para poder hacer commit del archivo vistos.json
    permissions:
      contents: write 

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar Python y dependencias
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Instalar librerías de Python
        run: pip install UnityPy requests Pillow

      - name: Descargar e instalar SteamCMD
        run: |
          mkdir steamcmd
          cd steamcmd
          curl -sqL "https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz" | tar zxvf -

      - name: Descargar Rust Staging (AppID 258550) via SteamCMD
        run: |
          ./steamcmd/steamcmd.sh +force_install_dir ${{ github.workspace }}/rust_staging +login anonymous +app_update 258550 -beta staging validate +quit

      - name: Ejecutar Dataminer (Extraer y notificar a Discord)
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python extract_and_notify.py

      - name: Guardar registro de assets vistos (Git Commit)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add vistos.json || true
          git commit -m "Actualizar registro de assets [skip ci]" || echo "No hay cambios para hacer commit"
          git push
