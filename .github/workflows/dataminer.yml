name: Rust Staging Dataminer

on:
  schedule:
    # Se ejecuta en el minuto 0 de cada hora
    - cron: '0 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

jobs:
  datamine:
    runs-on: ubuntu-latest
    # Necesario para poder hacer commit del archivo vistos.json
    permissions:
      contents: write 

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar Python y dependencias
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Instalar librerías de Python
        run: pip install UnityPy requests Pillow

      - name: Descargar e instalar DepotDownloader
        run: |
          wget https://github.com/SteamRE/DepotDownloader/releases/download/DepotDownloader_2.7.3/DepotDownloader-linux-x64.zip
          unzip DepotDownloader-linux-x64.zip -d depotdownloader
          chmod +x depotdownloader/DepotDownloader

      - name: Descargar Bundles de Rust Staging (AppID 258550)
        run: |
          ./depotdownloader/DepotDownloader -app 258550 -dir rust_staging -filematching "*.bundle" -max-downloads 2 -max-servers 2 -validate

      - name: Ejecutar Dataminer (Extraer y notificar a Discord)
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python extract_and_notify.py

      - name: Guardar registro de assets vistos (Git Commit)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add vistos.json || true
          git commit -m "Actualizar registro de assets [skip ci]" || echo "No hay cambios para hacer commit"
          git push
